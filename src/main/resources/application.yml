server:
  port: ${SERVER_PORT:8080}

spring:
  graphql:
    graphiql:
      enabled: true

jwt:
  secret-key: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:user-service}

clients:
  user-service:
    host: ${USER_SERVICE_HOST:localhost}
    port: ${USER_SERVICE_PORT:9090}
    plaintext: ${USER_SERVICE_PLAINTEXT:true}
    deadline-seconds: ${GRPC_DEADLINE_SECONDS:10}
  lineup-service:
    host: ${LINEUP_SERVICE_HOST:localhost}
    port: ${LINEUP_SERVICE_PORT:9091}
    plaintext: ${LINEUP_SERVICE_PLAINTEXT:true}
    deadline-seconds: ${LINEUP_DEADLINE_SECONDS:5}
  content-service:
    host: ${CONTENT_SERVICE_HOST:localhost}
    port: ${CONTENT_SERVICE_PORT:9096}
    plaintext: ${CONTENT_SERVICE_PLAINTEXT:true}
    deadline-seconds: ${CONTENT_DEADLINE_SECONDS:5}
  stamp-tour-service:
    host: ${STAMP_TOUR_SERVICE_HOST:localhost}
    port: ${STAMP_TOUR_SERVICE_PORT:9098}
    plaintext: ${STAMP_TOUR_SERVICE_PLAINTEXT:true}
    deadline-seconds: ${STAMP_TOUR_DEADLINE_SECONDS:5}
  cloud-gate-service:
    host: ${CLOUD_GATE_SERVICE_HOST:localhost}
    port: ${CLOUD_GATE_SERVICE_PORT:9094}
    plaintext: ${CLOUD_GATE_SERVICE_PLAINTEXT:true}
    deadline-seconds: ${CLOUD_GATE_DEADLINE_SECONDS:5}

logging:
  level:
    root: INFO