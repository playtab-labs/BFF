syntax = "proto3";

package lineup.v1;

option java_multiple_files = true;
option java_package = "com.playtab.lineupservice.grpc.proto";
option java_outer_classname = "LineupServiceProto";

import "google/protobuf/timestamp.proto";

service LineupService {
  rpc GetPerformers (GetPerformersRequest) returns (GetPerformersResponse);
  rpc GetSchedulesByDay (GetSchedulesByDayRequest) returns (GetSchedulesByDayResponse);
  rpc AddFavorite (AddFavoriteRequest) returns (AddFavoriteResponse);
  rpc RemoveFavorite (RemoveFavoriteRequest) returns (RemoveFavoriteResponse);
  rpc GetFavorites (GetFavoritesRequest) returns (GetFavoritesResponse);
  rpc GetFestivalDays (GetFestivalDaysRequest) returns (GetFestivalDaysResponse);
}

message LocalizedText {
  map<string, string> values = 1;
}

enum ScheduleStatusProto {
  SCHEDULE_STATUS_PROTO_UNSPECIFIED = 0;
  SCHEDULE_STATUS_PROTO_SCHEDULED = 1;
  SCHEDULE_STATUS_PROTO_CANCELLED = 2;
  SCHEDULE_STATUS_PROTO_COMPLETED = 3;
}

message Performer {
  int64 id = 1;
  LocalizedText name = 2;
  LocalizedText description = 3;
  string image_url = 4;
  bool is_active = 5;
  bool is_favorited = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  repeated LocalizedText stage_names = 9;
}

message Stage {
  int64 id = 1;
  LocalizedText name = 2;
  LocalizedText location_desc = 3;
  int32 display_order = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message FestivalDay {
  int64 id = 1;
  int32 day_number = 2;
  string event_date = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message PerformanceDuration {
  int32 duration_minutes = 1;
  string duration_label = 2;
}

message PerformanceSchedule {
  int64 id = 1;
  Performer performer = 2;
  Stage stage = 3;
  google.protobuf.Timestamp start_at = 4;
  google.protobuf.Timestamp end_at = 5;
  ScheduleStatusProto status = 6;
  PerformanceDuration duration = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ArtistSchedule {
  int64 schedule_id = 1;
  Performer performer = 2;
  google.protobuf.Timestamp start_at = 3;
  google.protobuf.Timestamp end_at = 4;
  ScheduleStatusProto status = 5;
  PerformanceDuration duration = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message StageSchedule {
  Stage stage = 1;
  repeated ArtistSchedule artists = 2;
}

message Favorite {
  int64 id = 1;
  string user_id = 2;
  int64 performer_id = 3;
  google.protobuf.Timestamp created_at = 4;
}

message GetPerformersRequest {
  optional bool active_only = 1;
  string stage_name = 2;
  string locale = 3;
}

message GetPerformersResponse {
  repeated Performer performers = 1;
}

message GetSchedulesByDayRequest {
  int64 day_id = 1;
  string stage_name = 2;
  string locale = 3;
}

message GetSchedulesByDayResponse {
  repeated StageSchedule stages = 1;
}

message AddFavoriteRequest {
  int64 performer_id = 1;
}

message AddFavoriteResponse {
  Favorite favorite = 1;
}

message RemoveFavoriteRequest {
  int64 performer_id = 1;
}

message RemoveFavoriteResponse {
  bool success = 1;
}

message GetFavoritesRequest {
}

message GetFavoritesResponse {
  repeated Performer performers = 1;
}

message GetFestivalDaysRequest {
}

message GetFestivalDaysResponse {
  repeated FestivalDay festival_days = 1;
}